[project]
name = "corbeausplat"
version = "2.0.0-beta.1"
description = "Gaussian Splatting toolkit with GUI"
requires-python = ">=3.10"
# Doit rester synchronisé avec requirements.txt (source du lock et de la CI).
# Sans cette section, deptry ne voit aucune dépendance déclarée et remonte
# ~40 faux positifs DEP001 sur PySide6/numpy/plyfile/PIL.
dependencies = [
    "PySide6>=6.6,<7",
    # requests/urllib3 retirés (deptry DEP002, item A2-M14) : aucun fichier ne
    # les importe, tout le réseau passe par urllib.request (stdlib — à ne pas
    # confondre avec urllib3). Ils restent installés en dev, tirés par pip-audit.
    "numpy>=1.26,<3",
    "send2trash>=1.8,<2",
    "pyobjc-framework-Cocoa>=10.0,<11; sys_platform == 'darwin'",
    "Pillow>=12.3,<13",
    "plyfile>=0.7,<1",
    "opencv-python-headless>=4.8,<5",
    "trimesh>=4.0,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "deptry>=0.23,<1",
    "pytest>=9.0,<10",
    "pytest-qt>=4.4,<5",
    "pip-audit>=2.8,<3",
    "pip-tools>=7.4,<8",
]

[tool.deptry]
# Modules importés dont le nom diffère du nom de paquet : sans cette table,
# deptry ne peut pas faire le lien hors environnement installé.
[tool.deptry.package_module_name_map]
Pillow = ["PIL"]
opencv-python-headless = ["cv2"]
pyobjc-framework-Cocoa = ["AppKit", "Foundation", "objc"]
PySide6 = ["PySide6"]
send2trash = ["send2trash"]

[tool.deptry.per_rule_ignores]
# Imports optionnels, résolus à l'exécution et déjà protégés par try/except :
# backends d'export GLB/SPZ et modules Blender.
# trimesh est désormais déclaré (le lanceur l'installait en douce, hors lock).
DEP001 = ["open3d", "spz", "bpy"]
# Mêmes modules, autre règle : spz est compilé et installé dans le venv par son
# propre installeur (app/scripts/installers/spz.py), jamais par pip depuis
# requirements. deptry le voit donc « installé mais non déclaré » (DEP003) quand
# il est présent, et « non déclaré » (DEP001) sinon — les deux listes doivent
# couvrir le même ensemble pour que le résultat ne dépende pas de l'état du venv.
DEP003 = ["open3d", "spz", "bpy"]
# Outils de dev déclarés dans l'extra [dev], jamais importés par le code.
DEP002 = ["ruff", "mypy", "deptry", "pytest", "pytest-qt", "pip-audit", "pip-tools"]

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
# N (naming) et ARG (unused-arg) désactivées : bruit systématique avec les
# conventions PySide6 (camelCase des overrides/signaux) et les interfaces
# uniformes (méthodes d'export partageant une signature commune).
ignore = ["SIM117"]
# SIM117 (nested with) : ~40 occurrences, uniquement des blocs mock.patch
# imbriqués dans les tests — réécriture mécanique risquée pour un gain
# purement stylistique.

[tool.mypy]
# strict = true jamais validé : mypy n'était jamais atteint en CI (ruff
# bloquait avant), 2072 erreurs sur ce codebase historiquement non typé.
# Mode par défaut : 29 erreurs réelles, corrigées.

[[tool.mypy.overrides]]
module = ["PySide6.*", "cv2.*", "numpy.*", "plyfile.*", "trimesh.*", "open3d.*", "PIL.*", "send2trash.*", "objc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Les tests e2e réels (binaires colmap/brush) sont lents et opt-in : désélectionnés
# par défaut. Pour les lancer :  pytest -m e2e
addopts = "-m 'not e2e'"
markers = [
    "e2e: pipeline end-to-end réel avec vrais binaires (colmap, brush) — lent, opt-in",
    "e2e_sharp: e2e réel Sharp (nécessite .venv_sharp + ffmpeg)",
    "e2e_upscale: e2e réel Upscale (nécessite upscayl-bin + modèles)",
    "e2e_4dgs: e2e réel 4DGS (nécessite .venv_4dgs + ffmpeg + colmap)",
    "e2e_360: e2e réel 360 Extractor (nécessite .venv_360)",
]
